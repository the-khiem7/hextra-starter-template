# Hugo configuration file
baseURL: "/"
title: "Hextra"

enableRobotsTXT: true
enableGitInfo: true

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

defaultContentLanguage: en
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: Hextra
    params:
      banner:
        key: announcement-v0.12
        message: |
          Hextra **v0.12** is here! 🎉 Discover [what's new]({{% relref "blog/v0.12" %}})
  vi:
    label: Tiếng Việt
    locale: vi-VN
    weight: 2
    title: Hextra
    params:
      banner:
        key: announcement-v0.12
        message: |
          Hextra **v0.12** is here! 🎉 Discover [what's new]({{% relref "blog/v0.12" %}})

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 1
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 2
    - identifier: showcase
      name: Showcase
      pageRef: /showcase
      weight: 3
      params:
        type: link
        icon: collection
    - identifier: more
      name: More
      weight: 4
    - identifier: versions
      name: Versions
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/imfing/hextra"
      params:
        icon: github
    - identifier: development
      name: Development ↗
      url: https://imfing.github.io/hextra/versions/latest/
      parent: versions
      params:
        type: link
        icon: beaker
    - identifier: v0.10
      name: v0.10 ↗
      url: https://imfing.github.io/hextra/versions/v0.10/
      parent: versions
    - identifier: v0.11
      name: v0.11 ↗
      url: https://imfing.github.io/hextra/versions/v0.11/
      parent: versions
    - identifier: about
      name: About
      pageRef: /about
      parent: more
      weight: 1
    - identifier: archives
      name: Archives
      pageRef: /archives
      parent: more
      weight: 2
    - identifier: glossary
      name: Glossary
      pageRef: /glossary
      parent: more
      weight: 3

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - identifier: about
      name: About
      pageRef: /about
      weight: 2
    - identifier: hugoDocs
      name: Hugo Docs ↗
      url: "https://gohugo.io/documentation/"
      weight: 3

params:
  description: Modern, responsive, batteries-included Hugo theme for creating beautiful static websites.
  externalLinkDecoration: true

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  displayUpdatedAuthor: false

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra/edit/main/docs/content"

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 20
    article:
      displayPagination: true

  archives:
    section: blog
    dateFormat: "Jan 02"

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: normal
    contextMenu:
      enable: false
      links:
        - name: Open in ChatGPT
          icon: chatgpt
          url: "https://chatgpt.com/?hints=search&q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."
        - name: Open in Claude
          icon: claude
          url: "https://claude.ai/new?q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."

  imageZoom:
    enable: true

  comments:
    enable: false
    type: giscus
